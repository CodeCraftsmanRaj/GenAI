
project:
  name: "Experiment 10 - Multimodal Content Generation"
  student_name: "Raj Mathuria"
  uid: "2023300139"
  batch: "PE-C"
  seed: 42
  output_dir: "results"

models:
  image:
    # Keep the original image-generation model.
    name: "stabilityai/sd-turbo"
    device: "auto"
    width: 768
    height: 432
    num_inference_steps: 4
    guidance_scale: 0.0

  audio:
    # Keep the original music-generation model.
    name: "facebook/musicgen-small"
    device: "auto"
    duration_seconds: 20
    max_new_tokens: 1024

prompts:
  common: >-
    An inspiring cinematic vision of humanity exploring Mars,
    scientific discovery, planetary exploration, and the future of space travel.

  image: >-
    Spectacular cinematic science-fiction documentary illustration of a human
    Mars exploration mission, a small realistic futuristic research habitat
    beside a Mars rover in the foreground, two astronaut silhouettes in detailed
    exploration suits looking toward a vast rust-red Martian landscape, enormous
    distant mountains, dramatic orange planetary horizon, a small blue Earth
    visible in the dark star-filled sky, subtle dust clouds, warm sunlight
    illuminating the terrain, scientifically inspired spacecraft design,
    realistic environmental textures, premium space-agency documentary artwork,
    strong visual depth, professional film composition, wide landscape framing,
    beautiful natural color grading, crisp focal subjects, no text, no letters,
    no logos, no watermarks, no extra limbs, no distorted astronauts.

  music: >-
    A continuous 20-second cinematic instrumental soundtrack for a documentary
    about humanity's exploration of Mars. Begin with mysterious spacious ambient
    synth pads and delicate piano notes, introduce warm sustained orchestral
    strings, gentle cinematic percussion, and a gradual sense of wonder and
    discovery. Build toward an uplifting, adventurous climax representing the
    first steps on another planet. Spacious futuristic atmosphere, polished
    documentary production, consistent moderate volume, smooth transitions,
    resolved ending suitable for a short fade-out. Instrumental only, no singing,
    no spoken words, no choir, no sound effects.

video:
  duration_seconds: 20
  fps: 24
  width: 1280
  height: 720

  title: "Mars: Humanity's Next Frontier"
  disclosure: "AI-GENERATED EDUCATIONAL CONTENT"

  captions:
    - start: 0
      end: 4
      text: "Mars offers a new frontier for planetary exploration."

    - start: 4
      end: 8
      text: "Robotic rovers help scientists study the Martian surface."

    - start: 8
      end: 12
      text: "Future missions may investigate whether Mars once supported life."

    - start: 12
      end: 16
      text: "Human missions will face challenges from radiation and isolation."

    - start: 16
      end: 20
      text: "Exploration depends on science, engineering, and careful planning."

  audio:
    volume: 0.82
    fade_out_seconds: 1.5

  motion:
    zoom_amount: 0.025
