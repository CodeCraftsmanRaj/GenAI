seed: 42

dataset:
  name: fashion_mnist
  data_dir: data
  image_size: 28
  channels: 1
  num_classes: 10
  batch_size: 128
  num_workers: 4

training:
  epochs: 100
  latent_dim: 100

  generator_lr: 0.0002
  discriminator_lr: 0.0001

  beta1: 0.5
  beta2: 0.999

  sample_every: 5
  checkpoint_every: 10

  output_dir: outputs

models:

  run: all

  gan:

    generator:
      hidden_units:
        - 256
        - 512
        - 1024

    discriminator:
      hidden_units:
        - 512
        - 256

  cgan:

    generator:
      hidden_units:
        - 256
        - 512
        - 1024

    discriminator:
      hidden_units:
        - 512
        - 256

  dcgan:

    generator:
      base_filters: 256
      filter_1: 128
      filter_2: 64

    discriminator:
      filter_1: 64
      filter_2: 128
      dropout: 0.3